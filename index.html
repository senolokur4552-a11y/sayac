<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Oyuncu Sıra ve Sayaç Sistemi</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f7f6;
            color: #333;
            max-width: 600px;
            margin: 40px auto;
            padding: 20px;
            text-align: center;
        }
        .card {
            background: #fff;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            margin-bottom: 20px;
        }
        input, select, button {
            padding: 10px 15px;
            font-size: 16px;
            margin: 8px 0;
            width: 100%;
            box-sizing: border-box;
            border-radius: 5px;
            border: 1px solid #ccc;
        }
        button {
            background-color: #007bff;
            color: white;
            border: none;
            cursor: pointer;
            transition: background 0.2s;
            font-weight: bold;
        }
        button:hover {
            background-color: #0056b3;
        }
        button:disabled {
            background-color: #ccc;
            cursor: not-allowed;
        }
        .player-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px;
            margin: 8px 0;
            background: #f9f9f9;
            border-radius: 5px;
            border-left: 5px solid #ccc;
        }
        .player-row.active {
            border-left-color: #28a745;
            background: #e8f5e9;
            font-weight: bold;
        }
        .player-row.finished {
            border-left-color: #dc3545;
            background: #f8d7da;
            color: #721c24;
            text-decoration: line-through;
        }
        .timer {
            font-family: monospace;
            font-size: 18px;
        }
        .input-group {
            text-align: left;
            margin-bottom: 10px;
        }
        .input-group label {
            font-size: 14px;
            font-weight: 600;
        }
    </style>
</head>
<body>

    <div class="card">
        <h2>🎮 Oyuncu Sıra ve Sayaç Sistemi</h2>
        <div id="setup-section">
            <div class="input-group">
                <label for="player-count">Oyuncu Sayısı:</label>
                <input type="number" id="player-count" min="1" max="10" value="4">
            </div>

            <div class="input-group">
                <label for="timer-mode">Sayaç Modu:</label>
                <select id="timer-mode" onchange="modDegisti()">
                    <option value="countdown">1. Geriye Sayım (Belirlenen süreden düşer)</option>
                    <option value="countup">2. Artan Sayaç (Sıfırdan yukarı artar, sınır yok)</option>
                </select>
            </div>

            <div class="input-group" id="time-limit-group">
                <label for="time-limit">Her Oyuncunun Başlangıç Süresi (Saniye):</label>
                <input type="number" id="time-limit" min="10" max="3600" value="60">
            </div>

            <button onclick="sistemiBaslat()">Sistemi Kur ve Başlat</button>
        </div>
    </div>

    <div class="card" id="game-section" style="display: none;">
        <h3 id="current-turn-text">Sıradaki: -</h3>
        
        <!-- Oynadım Butonu Üstte -->
        <div style="margin-top: 15px;">
            <button id="play-btn" onclick="sirayiDevret()" style="background-color: #28a745; font-size: 18px; padding: 12px 25px;">Oynadım / Sırayı Devret</button>
        </div>

        <hr style="margin: 20px 0; border: 0; border-top: 1px solid #eee;">
        <h4>Tüm Oyuncular ve Durumları</h4>
        <div id="players-list"></div>

        <!-- Bitti Butonu En Altta, Ayrı Bir Bölümde -->
        <div style="margin-top: 20px;">
            <button id="finish-btn" onclick="oyunBitirVeyaSifirla()" style="background-color: #dc3545; font-size: 16px; padding: 12px 25px;">Bitti</button>
        </div>
    </div>

    <script>
        let oyuncular = [];
        let aktifIndex = 0;
        let intervalId = null;
        let secilenMod = 'countdown';
        let baslangicSuresi = 60;
        let oyunBittiMi = false;

        function modDegisti() {
            secilenMod = document.getElementById('timer-mode').value;
            const timeLimitGroup = document.getElementById('time-limit-group');
            
            if (secilenMod === 'countup') {
                timeLimitGroup.style.display = 'none';
            } else {
                timeLimitGroup.style.display = 'block';
            }
        }

        function sistemiBaslat() {
            const count = parseInt(document.getElementById('player-count').value);
            secilenMod = document.getElementById('timer-mode').value;
            baslangicSuresi = parseInt(document.getElementById('time-limit').value);

            if (isNaN(count) || count <= 0) {
                alert("Lütfen geçerli bir oyuncu sayısı girin.");
                return;
            }

            oyuncular = [];
            for (let i = 1; i <= count; i++) {
                oyuncular.push({
                    id: i,
                    ad: `Oyuncu ${i}`,
                    kalanSure: secilenMod === 'countdown' ? baslangicSuresi : 0,
                    aktif: false,
                    bitti: false
                });
            }

            aktifIndex = 0;
            oyunBittiMi = false;
            oyuncular[0].aktif = true;

            document.getElementById('setup-section').parentElement.style.display = 'none';
            document.getElementById('game-section').style.display = 'block';
            document.getElementById('play-btn').disabled = false;
            document.getElementById('finish-btn').innerText = "Bitti";
            document.getElementById('finish-btn').style.backgroundColor = "#dc3545";

            listeyiGuncelle();
            sayaciBaslat();
        }

        function sayaciBaslat() {
            clearInterval(intervalId);
            
            intervalId = setInterval(() => {
                if (oyunBittiMi) return;

                let aktifOyuncu = oyuncular[aktifIndex];

                if (secilenMod === 'countdown') {
                    if (aktifOyuncu.kalanSure > 0) {
                        aktifOyuncu.kalanSure--;
                    } else {
                        sirayiDevret(); 
                        return;
                    }
                } else {
                    aktifOyuncu.kalanSure++;
                }
                listeyiGuncelle();
            }, 1000);
        }

        function sirayiDevret() {
            if (oyunBittiMi) return;

            oyuncular[aktifIndex].aktif = false;
            
            // Sırayı bir sonraki oyuncuya geçir (döngüsel: 1 -> 2 -> 3 -> 4 -> 1)
            aktifIndex = (aktifIndex + 1) % oyuncular.length;

            oyuncular[aktifIndex].aktif = true;
            listeyiGuncelle();
            sayaciBaslat();
        }

        function oyunBitirVeyaSifirla() {
            if (!oyunBittiMi) {
                // 1. Basış: Oyunu bitir, tüm sayaçları durdur
                clearInterval(intervalId);
                oyunBittiMi = true;

                oyuncular[aktifIndex].aktif = false;
                oyuncular[aktifIndex].bitti = true;

                document.getElementById('current-turn-text').innerText = "🏁 Oyun Bitti! Saniyeler Durduruldu.";
                document.getElementById('play-btn').disabled = true;
                
                // Butonu sıfırlama butonuna dönüştür
                const finishBtn = document.getElementById('finish-btn');
                finishBtn.innerText = "Sıfırla ve Başa Dön";
                finishBtn.style.backgroundColor = "#ffc107";
                finishBtn.style.color = "#333";

                listeyiGuncelle();
            } else {
                // 2. Basış: Saniyeleri sıfırla ve ilk ekrana dön
                clearInterval(intervalId);
                document.getElementById('game-section').style.display = 'none';
                document.getElementById('setup-section').parentElement.style.display = 'block';
            }
        }

        function listeyiGuncelle() {
            const listContainer = document.getElementById('players-list');
            listContainer.innerHTML = '';

            oyuncular.forEach((oyuncu) => {
                const row = document.createElement('div');
                let rowClass = '';
                if (oyuncu.bitti) {
                    rowClass = 'finished';
                } else if (oyuncu.aktif && !oyunBittiMi) {
                    rowClass = 'active';
                }
                row.className = `player-row ${rowClass}`;

                let dakika = Math.floor(oyuncu.kalanSure / 60);
                let saniye = oyuncu.kalanSure % 60;
                let formatliSure = `${dakika.toString().padStart(2, '0')}:${saniye.toString().padStart(2, '0')}`;

                let durumMetni = '';
                if (oyuncu.bitti) durumMetni = '❌ (Bitti)';
                else if (oyuncu.aktif && !oyunBittiMi) durumMetni = '👉 (Oynuyor)';

                row.innerHTML = `
                    <span>${oyuncu.ad} ${durumMetni}</span>
                    <span class="timer">${formatliSure}</span>
                `;
                listContainer.appendChild(row);
            });

            if (!oyunBittiMi && aktifIndex < oyuncular.length) {
                document.getElementById('current-turn-text').innerText = `Sıradaki Oyuncu: ${oyuncular[aktifIndex].ad}`;
            }
        }
    </script>

</body>
</html>
